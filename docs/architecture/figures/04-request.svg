  <text x="209.5" y="77.9" fill="#172c42" text-anchor="middle">1. Receive and remember</text>
  <text x="209.5" y="96.9" fill="#172c42" text-anchor="middle">Parse body and session headers</text>
  <text x="209.5" y="115.9" fill="#172c42" text-anchor="middle">Update turn and bounded prompt LRU</text>
