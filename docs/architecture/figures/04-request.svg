  <rect x="0" y="0" width="1412" height="555" fill="#111111"/>
  <path d="M60.5 40 H358.5 a8 8 0 0 1 8 8 V117 a8 8 0 0 1 -8 8 H60.5 a8 8 0 0 1 -8 -8 V48 a8 8 0 0 1 8 -8 Z" fill="#e8f1fa" stroke="#37618a"/>
  <text x="209.5" y="68.4" fill="#172c42" text-anchor="middle">1. Receive and remember</text>
  <text x="209.5" y="87.4" fill="#172c42" text-anchor="middle">Parse body and session headers</text>
  <text x="209.5" y="106.4" fill="#172c42" text-anchor="middle">Update turn and bounded prompt LRU</text>
  <path d="M504.9 40 H802.9 a8 8 0 0 1 8 8 V117 a8 8 0 0 1 -8 8 H504.9 a8 8 0 0 1 -8 -8 V48 a8 8 0 0 1 8 -8 Z" fill="#e8f1fa" stroke="#37618a"/>
  <text x="653.9" y="68.4" fill="#172c42" text-anchor="middle">2. Predict expected times</text>
  <text x="653.9" y="87.4" fill="#172c42" text-anchor="middle">BoardClient or local fallback</text>
  <text x="653.9" y="106.4" fill="#172c42" text-anchor="middle">Budgeted executor; record outcomes</text>
  <path d="M978.3 40 H1276.3 a8 8 0 0 1 8 8 V117 a8 8 0 0 1 -8 8 H978.3 a8 8 0 0 1 -8 -8 V48 a8 8 0 0 1 8 -8 Z" fill="#e8f1fa" stroke="#37618a"/>
  <text x="1127.3" y="68.4" fill="#172c42" text-anchor="middle">3. Compute scheduling metadata</text>
  <text x="1127.3" y="87.4" fill="#172c42" text-anchor="middle">proxy/index.py: CallMeta</text>
  <text x="1127.3" y="106.4" fill="#172c42" text-anchor="middle">Class, tier, index, promotion time</text>
  <path d="M56.5 235 H362.5 a8 8 0 0 1 8 8 V312 a8 8 0 0 1 -8 8 H56.5 a8 8 0 0 1 -8 -8 V243 a8 8 0 0 1 8 -8 Z" fill="#e8f1fa" stroke="#37618a"/>
  <text x="209.5" y="263.4" fill="#172c42" text-anchor="middle">6. Forward when released</text>
  <text x="209.5" y="282.4" fill="#172c42" text-anchor="middle">Session header + nvext.agent_hints</text>
  <text x="209.5" y="301.4" fill="#172c42" text-anchor="middle">Upstream streaming or JSON response</text>
  <path d="M551.9 235 H841.9 a8 8 0 0 1 8 8 V312 a8 8 0 0 1 -8 8 H551.9 a8 8 0 0 1 -8 -8 V243 a8 8 0 0 1 8 -8 Z" fill="#fff0df" stroke="#af702f"/>
  <text x="696.9" y="263.4" fill="#513416" text-anchor="middle">5. Release eligible entries</text>
  <text x="696.9" y="282.4" fill="#513416" text-anchor="middle">Admission window and hold cap</text>
  <text x="696.9" y="301.4" fill="#513416" text-anchor="middle">Timer handles delay and promotion</text>
  <path d="M1031.3 235 H1363.3 a8 8 0 0 1 8 8 V312 a8 8 0 0 1 -8 8 H1031.3 a8 8 0 0 1 -8 -8 V243 a8 8 0 0 1 8 -8 Z" fill="#eaf5ed" stroke="#50815c"/>
  <text x="1197.3" y="263.4" fill="#203d28" text-anchor="middle">4. Enqueue in HoldQueue</text>
  <text x="1197.3" y="282.4" fill="#203d28" text-anchor="middle">Ready, arrival, delay, promotion heaps</text>
  <text x="1197.3" y="301.4" fill="#203d28" text-anchor="middle">Entry identity and stable tie ordering</text>
  <path d="M48 430 H371 a8 8 0 0 1 8 8 V507 a8 8 0 0 1 -8 8 H48 a8 8 0 0 1 -8 -8 V438 a8 8 0 0 1 8 -8 Z" fill="#e8f1fa" stroke="#37618a"/>
  <text x="209.5" y="458.4" fill="#172c42" text-anchor="middle">7. Complete or cancel</text>
  <text x="209.5" y="477.4" fill="#172c42" text-anchor="middle">Finish once; return window capacity</text>
  <text x="209.5" y="496.4" fill="#172c42" text-anchor="middle">Preserve response and clean resources</text>
  <path d="M531.4 430 H854.4 a8 8 0 0 1 8 8 V507 a8 8 0 0 1 -8 8 H531.4 a8 8 0 0 1 -8 -8 V438 a8 8 0 0 1 8 -8 Z" fill="#eaf5ed" stroke="#50815c"/>
  <text x="692.9" y="458.4" fill="#203d28" text-anchor="middle">Lifecycle records throughout</text>
  <text x="692.9" y="477.4" fill="#203d28" text-anchor="middle">Request and first token before finish</text>
  <text x="692.9" y="496.4" fill="#203d28" text-anchor="middle">Done and trace on completion</text>
  <path d="M980.4 430 H1278.4 a8 8 0 0 1 8 8 V507 a8 8 0 0 1 -8 8 H980.4 a8 8 0 0 1 -8 -8 V438 a8 8 0 0 1 8 -8 Z" fill="#fff0df" stroke="#af702f"/>
  <text x="1129.4" y="458.4" fill="#513416" text-anchor="middle">Separate keep-alive path</text>
  <text x="1129.4" y="477.4" fill="#513416" text-anchor="middle">POST /touch uses remembered prompt</text>
  <text x="1129.4" y="496.4" fill="#513416" text-anchor="middle">One output token; lowest priority</text>
