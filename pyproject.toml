[project]
name = "atfm"
version = "0.1.0"
description = "Agent traffic flow management for LLM serving"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=15",
  "pyyaml>=6",
]

[project.optional-dependencies]
serve = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
harness = ["mini-swe-agent>=2.4"]
dynamo = ["ai-dynamo>=1.5"]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.24", "httpx>=0.27", "fastapi>=0.115"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atfm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = ["atfm-experiments"]

[tool.uv.workspace]
members = ["experiments"]

[tool.uv.sources]
atfm-experiments = { workspace = true }
