proxy_url: null
model: Qwen/Qwen3-0.6B
events_path: runs/collect/l1_long_events.jsonl
concurrency: 1
jobs:
- name: pytest-numpy
  class: background
  tenant: t1
  image: python:3.12-slim
  repeat: 2
  timeout_s: 3600
  setup:
  - pip install -q numpy pytest hypothesis typing_extensions >/dev/null 2>&1
  turns:
  - cmd: python -m pytest --pyargs numpy -v -p no:cacheprovider --continue-on-collection-errors -k 'not f2py and not distutils and not mem_policy' 2>&1
