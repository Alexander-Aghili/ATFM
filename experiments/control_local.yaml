# Controllers for the laptop end-to-end run (Mocker workers). Capacity comes from the metrics scrape.
gdp: {slot_s: 30.0, horizon_s: 300.0, eps: 0.1, max_hold_s: 60.0}
touch: {horizon_s: 30.0, age_s: 10.0, budget_per_s: 0.5, tick_s: 5.0}
tier: {tier_lead_s: {gpu: 0.0, cpu: 5.0, disk: 60.0}}
replica: {lead_time_s: 300.0, blocks_per_replica: 8000, prefill_tps_per_replica: 20000.0}
metrics: {url: "http://127.0.0.1:8000/metrics", default_total_blocks: 8000, default_worker_id: "mocker", pressure_threshold: 0.9, interval_s: 5.0}
