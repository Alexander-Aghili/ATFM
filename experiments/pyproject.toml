[project]
name = "atfm-experiments"
version = "0.1.0"
description = "Research experiment runners for ATFM"
requires-python = ">=3.12,<3.13"
dependencies = [
  "atfm==0.1.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atfm_experiments"]

[tool.uv.sources]
atfm = { workspace = true }
