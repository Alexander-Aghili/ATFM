# Interactive sessions also run long, signalled tools, so M1 and M2 can separate in closed loop.
# Loaded rates (the base rates never stress a 2 s SLO); hold cap 60 s; like-for-like oracle included.
name: h2sim_interactive_long_touch2
regime: interactive_long_tool
seeds: [0, 1, 2]
arms: [native, proxy_rules, forecast_M2_kv, forecast_M2_touch, oracle_touch, touch_random]
engines:
  - {kv_blocks: 6000, max_batch: 6, prefill_tps: 20000.0, decode_tps: 40.0, priority: true, touch_step_s: 0.05}
window: 6
beta: 0.5
slo_ttft_s: 2.0
working_set_budget: 4500
duration_s: 3600
interactive_rate_per_hour: 300
background_rate_per_hour: 480
max_hold_s: 60
touch_budget_per_s: 1.0
touch_horizon_s: 30.0
touch_age_s: 10.0
touch_prefetch: true
touch_retry: true
