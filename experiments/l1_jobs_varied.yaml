# Long tools with VARIED durations per tool so per-session H1b is not degenerate (no identical repeats).
proxy_url: null
model: Qwen/Qwen3-0.6B
events_path: runs/collect/l1_varied_events.jsonl
concurrency: 1
jobs:
  - {name: pipe-s-a, class: background, tenant: t3, image: "python:3.12-slim", repeat: 2, setup: [{file: scripts/tools/pipeline.py, to: /w/pipeline.py}], turns: [{cmd: "python /w/pipeline.py --rows 600 --rate 8 --signal strong"}]}
  - {name: pipe-s-b, class: background, tenant: t3, image: "python:3.12-slim", repeat: 2, setup: [{file: scripts/tools/pipeline.py, to: /w/pipeline.py}], turns: [{cmd: "python /w/pipeline.py --rows 900 --rate 5 --signal strong"}]}
  - {name: pipe-s-c, class: background, tenant: t3, image: "python:3.12-slim", repeat: 2, setup: [{file: scripts/tools/pipeline.py, to: /w/pipeline.py}], turns: [{cmd: "python /w/pipeline.py --rows 1500 --rate 12 --signal strong"}]}
  - {name: pipe-s-d, class: background, tenant: t3, image: "python:3.12-slim", repeat: 2, setup: [{file: scripts/tools/pipeline.py, to: /w/pipeline.py}], turns: [{cmd: "python /w/pipeline.py --rows 2400 --rate 10 --signal strong"}]}
  - {name: pipe-w-a, class: background, tenant: t3, image: "python:3.12-slim", repeat: 2, setup: [{file: scripts/tools/pipeline.py, to: /w/pipeline.py}], turns: [{cmd: "python /w/pipeline.py --rows 500 --rate 6 --signal weak"}]}
  - {name: pipe-w-b, class: background, tenant: t3, image: "python:3.12-slim", repeat: 2, setup: [{file: scripts/tools/pipeline.py, to: /w/pipeline.py}], turns: [{cmd: "python /w/pipeline.py --rows 1200 --rate 4 --signal weak"}]}
  - name: build-fmt-j2
    class: background
    tenant: t2
    image: gcc:13
    repeat: 2
    timeout_s: 3600
    setup:
      - "apt-get update -qq >/dev/null && apt-get install -y -qq cmake git >/dev/null"
      - "git clone -q --depth 1 https://github.com/fmtlib/fmt /w/fmt"
    turns:
      - {cmd: "cd /w/fmt && cmake -S . -B build -DFMT_TEST=ON >/dev/null && cmake --build build -j2"}
  - name: build-fmt-j1
    class: background
    tenant: t2
    image: gcc:13
    repeat: 2
    timeout_s: 3600
    setup:
      - "apt-get update -qq >/dev/null && apt-get install -y -qq cmake git >/dev/null"
      - "git clone -q --depth 1 https://github.com/fmtlib/fmt /w/fmt"
    turns:
      - {cmd: "cd /w/fmt && cmake -S . -B build -DFMT_TEST=ON >/dev/null && cmake --build build -j1"}
  - name: build-cjson-tests
    class: background
    tenant: t2
    image: gcc:13
    repeat: 2
    timeout_s: 3600
    setup:
      - "apt-get update -qq >/dev/null && apt-get install -y -qq cmake git >/dev/null"
      - "git clone -q --depth 1 https://github.com/DaveGamble/cJSON /w/cJSON"
    turns:
      - {cmd: "cd /w/cJSON && cmake -S . -B build -DENABLE_CJSON_TEST=ON >/dev/null && cmake --build build -j1"}
