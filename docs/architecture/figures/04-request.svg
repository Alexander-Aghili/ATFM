  <text x="662.4" y="68.4" fill="#172c42" text-anchor="middle">2. Predict expected times</text>
  <text x="662.4" y="87.4" fill="#172c42" text-anchor="middle">Bounded outstanding jobs or fallback</text>
  <text x="662.4" y="106.4" fill="#172c42" text-anchor="middle">One deadline; worker-lifetime</text>
  <text x="662.4" y="125.4" fill="#172c42" text-anchor="middle">accounting</text>
  <path d="M995.3 49.5 H1293.3 a8 8 0 0 1 8 8 V126.5 a8 8 0 0 1 -8 8 H995.3 a8 8 0 0 1 -8 -8 V57.5 a8 8 0 0 1 8 -8 Z" fill="#e8f1fa" stroke="#37618a"/>
  <text x="1144.3" y="77.9" fill="#172c42" text-anchor="middle">3. Compute scheduling metadata</text>
  <text x="1144.3" y="96.9" fill="#172c42" text-anchor="middle">proxy/index.py: CallMeta</text>
  <text x="1144.3" y="115.9" fill="#172c42" text-anchor="middle">Class, tier, index, promotion time</text>
