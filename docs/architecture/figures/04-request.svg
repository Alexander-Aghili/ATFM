  <text x="209.5" y="272.9" fill="#172c42" text-anchor="middle">6. Forward when released</text>
  <text x="209.5" y="291.9" fill="#172c42" text-anchor="middle">Session header + nvext.agent_hints</text>
  <text x="209.5" y="310.9" fill="#172c42" text-anchor="middle">Upstream streaming or JSON response</text>
  <path d="M551.9 244.5 H841.9 a8 8 0 0 1 8 8 V321.5 a8 8 0 0 1 -8 8 H551.9 a8 8 0 0 1 -8 -8 V252.5 a8 8 0 0 1 8 -8 Z" fill="#fff0df" stroke="#af702f"/>
  <text x="696.9" y="272.9" fill="#513416" text-anchor="middle">5. Release eligible entries</text>
  <text x="696.9" y="291.9" fill="#513416" text-anchor="middle">Admission window and hold cap</text>
  <text x="696.9" y="310.9" fill="#513416" text-anchor="middle">Timer handles delay and promotion</text>
  <path d="M1031.3 244.5 H1363.3 a8 8 0 0 1 8 8 V321.5 a8 8 0 0 1 -8 8 H1031.3 a8 8 0 0 1 -8 -8 V252.5 a8 8 0 0 1 8 -8 Z" fill="#eaf5ed" stroke="#50815c"/>
  <text x="1197.3" y="272.9" fill="#203d28" text-anchor="middle">4. Enqueue in HoldQueue</text>
  <text x="1197.3" y="291.9" fill="#203d28" text-anchor="middle">Ready, arrival, delay, promotion heaps</text>
  <text x="1197.3" y="310.9" fill="#203d28" text-anchor="middle">Entry identity and stable tie ordering</text>
  <path d="M48 439.5 H371 a8 8 0 0 1 8 8 V516.5 a8 8 0 0 1 -8 8 H48 a8 8 0 0 1 -8 -8 V447.5 a8 8 0 0 1 8 -8 Z" fill="#e8f1fa" stroke="#37618a"/>
  <text x="209.5" y="467.9" fill="#172c42" text-anchor="middle">7. Complete or cancel</text>
  <text x="209.5" y="486.9" fill="#172c42" text-anchor="middle">Finish once; return window capacity</text>
  <text x="209.5" y="505.9" fill="#172c42" text-anchor="middle">Preserve response and clean resources</text>
  <path d="M531.4 439.5 H854.4 a8 8 0 0 1 8 8 V516.5 a8 8 0 0 1 -8 8 H531.4 a8 8 0 0 1 -8 -8 V447.5 a8 8 0 0 1 8 -8 Z" fill="#eaf5ed" stroke="#50815c"/>
  <text x="692.9" y="467.9" fill="#203d28" text-anchor="middle">Lifecycle records throughout</text>
  <text x="692.9" y="486.9" fill="#203d28" text-anchor="middle">Request and first token before finish</text>
  <text x="692.9" y="505.9" fill="#203d28" text-anchor="middle">Done and trace on completion</text>
  <path d="M980.4 439.5 H1278.4 a8 8 0 0 1 8 8 V516.5 a8 8 0 0 1 -8 8 H980.4 a8 8 0 0 1 -8 -8 V447.5 a8 8 0 0 1 8 -8 Z" fill="#fff0df" stroke="#af702f"/>
  <text x="1129.4" y="467.9" fill="#513416" text-anchor="middle">Separate keep-alive path</text>
  <text x="1129.4" y="486.9" fill="#513416" text-anchor="middle">POST /touch uses remembered prompt</text>
  <text x="1129.4" y="505.9" fill="#513416" text-anchor="middle">One output token; lowest priority</text>
